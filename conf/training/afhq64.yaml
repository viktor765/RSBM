defaults:
  - base
  - _self_
pretrain_lr: 0.0002
finetune_lr: 0.0002
adam_betas: [0.9, 0.999]
# De Bortoli et al. (2024) clip at 1 on the drift loss; ours is divided by
# sigma^2 = 0.75^2, so the same clipping is 1 / 0.75^2 = 16/9.
max_grad_norm: 1.7777777777777777
use_ema: true
ema_rate: 0.999
batch_size: 128
n_pretrain_steps: 100_000
n_finetune_steps: 20_000
log_freq: 1_000
lr_warmup_steps: 5_000
compile_ema: true
compile_model: true
precision: bf16
finetune_sampling_precision: bf16
checkpoint:
  finetune_frequency: 2_500
