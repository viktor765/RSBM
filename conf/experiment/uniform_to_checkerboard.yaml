# @package _global_
defaults:
  - data@data.data0: uniform_square
  - data@data.data1: checkerboard
  - override /sde: reflected
  - override /model: toy_policy
  - override /training: toy2dsb
  - _self_

experiment_short_name: uniform-to-checkerboard

model:
  # Upstream RSB-FBSDE's parametrization, for both methods: the networks
  # output the control Z and the drift is sde.sigma * Z.
  output: control
data:
  num_workers: 0
  pin_memory: false
sde:
  sigma: 0.5
  euler_steps: 100
  n_reflections: 9
eval:
  freq: 60  # in freq_unit, for both methods, from step 0
  # iterations (optimizer updates) or seconds (of training_seconds).
  freq_unit: seconds
  # Paths per direction and evaluation; W2 uses all of them.
  n_samples: 4096
  weights: [ema]
  toy2d:
    # Slim sweep evaluation: only known-target grid W2 and control cost.
    sweep_metrics_only: false
    known_target_grid_subdivisions: 16
    final_artifacts: true
