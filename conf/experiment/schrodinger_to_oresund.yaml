# @package _global_
# Schrodinger portrait -> Oresund bridge photo on [-2pi, 2pi]^2, with
# uniform_to_checkerboard's network, reference process, solver and evaluation,
# so each method's checkerboard recipe carries over unscaled.
defaults:
  - data@data.data0: schrodinger
  - data@data.data1: oresundsbron
  - override /sde: reflected
  - override /model: toy_policy
  - override /training: toy2dsb
  - _self_

experiment_short_name: schrodinger-to-oresund

model:
  # Upstream RSB-FBSDE's parametrization, for both methods: the networks
  # output the control Z and the drift is sde.sigma * Z.
  output: control
data:
  num_workers: 0
  pin_memory: false
sde:
  sigma: 0.5
  euler_steps: 100
  n_reflections: 9
eval:
  freq: 60  # in freq_unit, for both methods, from step 0
  # iterations (optimizer updates) or seconds (of training_seconds).
  freq_unit: seconds
  # Paths per direction and evaluation; W2 uses all of them.
  n_samples: 4096
  # Both methods score their EMA weights, which also sample training paths
  # (training.use_ema).
  weights: [ema]
  toy2d:
    final_artifacts: true
    # Figures only: denser snapshots show the images.
    n_snapshot_times: 5
    n_snapshot_particles: 2500
